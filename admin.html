<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F5;--surface:#F0EEE6;--border:#E0DDD3;--text:#1F1E1D;--muted:#6B6862;--accent:#EC0082;--accent-dark:#A3005A;--accent-light:#FCE0EF;--ok:#1a7f3c;--warn:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:'Fraunces',Georgia,serif}
button{font-family:inherit;cursor:pointer}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:9px 16px;border-radius:9px;font-size:14px;font-weight:600}
.btn{text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-danger{color:#b00020}
input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;font:inherit;color:inherit}
input:focus,textarea:focus{outline:2px solid var(--accent-light);border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}

/* login */
#gate{max-width:560px;margin:8vh auto;padding:0 20px}
#gate .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:32px;max-width:420px;margin:0 auto}
#gate h1{font-size:26px;margin-bottom:6px}
#gate p.sub{color:var(--muted);margin-bottom:22px}
.lab{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
#login .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:32px}
#login h1{font-size:26px;margin-bottom:6px}
#login p.sub{color:var(--muted);margin-bottom:22px}
#login ol{margin:14px 0 20px 20px;color:var(--muted);font-size:13px}
#login li{margin-bottom:4px}
#login label.chk{display:flex;gap:8px;align-items:center;margin:12px 0 18px;color:var(--muted)}
.err{color:#b00020;margin-top:12px;font-size:13px;min-height:18px}

/* app */
#app{display:none;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;background:rgba(250,249,245,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 20px}
header.top h1{font-size:19px;margin-right:auto}
#status{font-size:13px;color:var(--muted)}
#status.dirty{color:var(--warn);font-weight:600}
#status.ok{color:var(--ok);font-weight:600}
.layout{display:grid;grid-template-columns:280px 1fr;gap:0}
nav.side{border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;background:var(--surface)}
nav.side .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
nav.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--text)}
nav.side button:hover{background:#fff}
nav.side button.on{background:var(--accent-light);color:var(--accent-dark);font-weight:600}
main.pane{padding:26px 28px 90px;max-width:900px}
main.pane h2{font-size:24px;margin-bottom:4px}
main.pane .lead{color:var(--muted);margin-bottom:22px}
.field{margin-bottom:16px}
.field>label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
fieldset{border:1px solid var(--border);border-radius:14px;padding:16px 18px 6px;margin-bottom:18px;background:#fff}
fieldset>legend{padding:0 8px;font-weight:600;font-size:13px;color:var(--accent-dark)}
details.item{border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:10px}
details.item>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .t{margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.item>summary .n{color:var(--muted);font-weight:500;font-size:12px}
details.item[open]>summary{border-bottom:1px solid var(--border)}
details.item .body{padding:16px 16px 4px}
.img-row{display:flex;gap:12px;align-items:center}
.thumb{width:84px;height:56px;border:1px solid var(--border);border-radius:9px;background:#fff repeating-conic-gradient(#f2f2f2 0 25%,#fff 0 50%) 0 0/12px 12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.img-row .col{flex:1;display:flex;flex-direction:column;gap:6px}
.bool{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.savebar{position:fixed;left:280px;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:12px 24px;display:flex;gap:10px;align-items:center;z-index:15}
.savebar .sp{margin-right:auto;color:var(--muted);font-size:13px}
.toast{position:fixed;top:70px;right:20px;background:#111;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:340px;display:none}
.toast.err{background:#b00020}
@media(max-width:820px){.layout{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;padding:10px}nav.side .grp{width:100%;margin:8px 4px 2px}nav.side button{width:auto;border:1px solid var(--border);background:#fff}.savebar{left:0}main.pane{padding:18px 16px 100px}}
</style>
</head>
<body>

<div id="gate" style="display:none">
  <div class="card">
    <h1>Site admin</h1>
    <p class="sub">Sign in to manage the website.</p>
    <label class="lab" for="uid">ID</label>
    <input type="text" id="uid" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label class="lab" for="pwd" style="margin-top:12px">Password</label>
    <input type="password" id="pwd" autocomplete="current-password">
    <button class="btn btn-primary" id="gateBtn" style="margin-top:18px">Sign in</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>Site admin</h1>
    <span id="status">Loaded</span>
    <a class="btn btn-sm" id="viewSite" href="/" target="_blank" rel="noopener">View site</a>
    <button class="btn btn-sm" id="backup">Backup</button>
    <button class="btn btn-sm" id="signout">Sign out</button>
  </header>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <main class="pane" id="pane"></main>
  </div>
  <div class="savebar">
    <span class="sp" id="saveNote">No unsaved changes.</span>
    <button class="btn" id="discard">Discard changes</button>
    <button class="btn btn-primary" id="publish" disabled>Publish changes</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var SITE = location.origin + '/';
  var data = null, original = '', dirty = false, pending = {}, current = null;

  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  };

  var TITLES = { main: 'Home page (Rohiet Rathi)', company: 'Company details', rohits: "Rohit's Supply website" };
  var SUBTITLES = { nav: 'Top menu', hero: 'Top section', about: 'About', investments: 'Investments', flagship: 'Flagship company', contact: 'Contact', footer: 'Footer', home: 'Home page', products: 'Products page', customers: 'Customers page', brands: 'Brands (logos & links)' };
  var HELP = {
    websiteUrl: 'Full web address (https://...). Leave empty to use this site\'s own page instead.',
    logo: 'Upload an image, or paste an image address. PNG with transparent background works best.',
    photo: 'Upload a new photo, or paste an image address.',
    wideLogo: 'Tick for wide logos (like a wordmark) so they are not squeezed into a square.',
    page: 'Internal page name (used only when there is no website address).',
    phone: 'Digits with country code, no spaces. Used for the Call button.',
    whatsappNumber: 'Digits only, with country code (no + or spaces).',
    icon: 'Any emoji.',
    number: 'The big figure, e.g. 60+ or ₹50Cr+',
    linkText: 'Text shown for the link.'
  };
  var TEXTAREA_KEYS = { text: 1, lead: 1, description: 1, cardBio: 1, whatsappMessage: 1, heroLead: 1, ctaText: 1, brandsText: 1, whyText: 1 };
  var IMG_KEYS = { logo: 1, photo: 1, image: 1 };

  function pretty(k) {
    var s = k.replace(/([A-Z])/g, ' $1').replace(/[_-]/g, ' ');
    s = s.replace(/\burl\b/i, 'URL').replace(/^./, function (c) { return c.toUpperCase(); });
    return s.replace(/\bWebsite URL\b/, 'Website address');
  }
  function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, err ? 7000 : 3500); }
  function setDirty(v) {
    dirty = v; $('publish').disabled = !v;
    $('status').textContent = v ? 'Unsaved changes' : 'All changes published'; $('status').className = v ? 'dirty' : 'ok';
    $('saveNote').textContent = v ? 'You have unpublished changes.' : 'No unsaved changes.';
  }
  function markDirty() { setDirty(JSON.stringify(data) !== original || Object.keys(pending).length > 0); }

  // ---------- server API ----------
  function api(path, opts) {
    opts = opts || {}; opts.credentials = 'same-origin'; opts.cache = 'no-store';
    if (opts.json !== undefined) { opts.method = opts.method || 'POST'; opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(opts.json); }
    return fetch('/api/' + path, opts).then(function (r) {
      return r.text().then(function (t) {
        var j = {}; try { j = JSON.parse(t); } catch (e) {}
        if (!r.ok) { var err = new Error(j.error || ('Server error ' + r.status)); err.status = r.status; throw err; }
        return j;
      });
    });
  }
  function loadContent() {
    return api('content?fresh=1').then(function (j) { data = j; original = JSON.stringify(data); pending = {}; });
  }
  function showApp() {
    $('gate').style.display = 'none'; $('app').style.display = 'block';
    return loadContent().then(function () { buildNav(); setDirty(false); $('status').textContent = 'Loaded'; });
  }
  function gate() { $('app').style.display = 'none'; $('gate').style.display = 'block'; }

  // ---------- sign in ----------
  function tryGate() {
    var btn = $('gateBtn'); btn.disabled = true; btn.textContent = 'Signing in...';
    api('login', { json: { id: $('uid').value, password: $('pwd').value } })
      .then(function () { $('gateErr').textContent = ''; return showApp(); })
      .catch(function (e) { $('gateErr').textContent = e.message; $('pwd').value = ''; })
      .then(function () { btn.disabled = false; btn.textContent = 'Sign in'; });
  }
  $('gateBtn').addEventListener('click', tryGate);
  $('pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryGate(); });
  $('uid').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('pwd').focus(); });
  $('signout').addEventListener('click', function () {
    if (dirty && !confirm('You have unpublished changes. Sign out anyway?')) return;
    api('logout', { method: 'POST' }).then(function () { dirty = false; location.reload(); });
  });
  api('session').then(showApp).catch(function () { gate(); });

  // ---------- navigation ----------
  function buildNav() {
    var side = $('side'); side.innerHTML = '';
    Object.keys(data).forEach(function (top) {
      side.appendChild(el('div', { class: 'grp', text: TITLES[top] || pretty(top) }));
      var node = data[top];
      var nested = !Array.isArray(node) && Object.keys(node).every(function (k) { return node[k] !== null && typeof node[k] === 'object'; });
      var subs = nested ? Object.keys(node) : [null];
      subs.forEach(function (sub) {
        var path = sub === null ? [top] : [top, sub];
        var label = sub === null ? (TITLES[top] || pretty(top)) : (SUBTITLES[sub] || pretty(sub));
        var b = el('button', { text: label, 'data-path': path.join('.') });
        b.addEventListener('click', function () { show(path); });
        side.appendChild(b);
      });
    });
    var first = side.querySelector('button'); if (first) first.click();
  }
  function getPath(p) { return p.reduce(function (o, k) { return o[k]; }, data); }
  function show(path) {
    current = path;
    [].forEach.call($('side').querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-path') === path.join('.')); });
    var pane = $('pane'); pane.innerHTML = '';
    var title = path.length === 1 ? (TITLES[path[0]] || pretty(path[0])) : (SUBTITLES[path[1]] || pretty(path[1]));
    pane.appendChild(el('h2', { text: title }));
    pane.appendChild(el('p', { class: 'lead', text: 'Edit the fields below, then press "Publish changes".' }));
    var parent = path.length > 1 ? getPath(path.slice(0, -1)) : data, key = path[path.length - 1];
    pane.appendChild(node(parent, key, key, true));
    window.scrollTo(0, 0);
  }

  // ---------- generic editor ----------
  function imgSrc(v) { if (!v) return ''; if (pending[v]) return pending[v].dataUrl; return /^(https?:|data:)/.test(v) ? v : SITE + v; }

  function field(labelText, control, helpKey) {
    var f = el('div', { class: 'field' }, [el('label', { text: labelText }), control]);
    if (HELP[helpKey]) f.appendChild(el('div', { class: 'help', text: HELP[helpKey] }));
    return f;
  }

  function imageControl(parent, key) {
    var input = el('input', { type: 'text', value: parent[key] || '', placeholder: 'assets/... or https://...' });
    var img = el('img', { src: imgSrc(parent[key]), alt: '' }); img.onerror = function () { img.style.display = 'none'; }; img.onload = function () { img.style.display = ''; };
    var file = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    var up = el('button', { class: 'btn btn-sm', type: 'button', text: 'Upload new image' });
    up.addEventListener('click', function () { file.click(); });
    input.addEventListener('input', function () { parent[key] = input.value; img.src = imgSrc(input.value); markDirty(); });
    file.addEventListener('change', function () {
      var f = file.files[0]; if (!f) return;
      prepImage(f).then(function (r) {
        var path = 'assets/uploads/' + Date.now() + '-' + f.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/-+/g, '-');
        var name = r.type === f.type ? path : path.replace(/\.[a-z0-9]+$/, '') + (r.type === 'image/png' ? '.png' : '.jpg');
        pending[name] = r; parent[key] = name; input.value = name; img.src = r.dataUrl; markDirty();
        toast('Image ready. It uploads when you press Publish.');
      }).catch(function (e) { toast(e.message, true); });
    });
    return el('div', { class: 'img-row' }, [el('div', { class: 'thumb' }, [img]), el('div', { class: 'col' }, [input, el('div', {}, [up, file])])]);
  }
  function prepImage(f) {
    return new Promise(function (res, rej) {
      if (f.size > 8 * 1024 * 1024) return rej(new Error('That image is over 8 MB. Please use a smaller one.'));
      var rd = new FileReader();
      rd.onerror = function () { rej(new Error('Could not read that file.')); };
      rd.onload = function () {
        var url = rd.result;
        if (f.type === 'image/svg+xml' || f.size < 900 * 1024) return res(pack(url, f.type));
        var im = new Image(); im.onerror = function () { res(pack(url, f.type)); };
        im.onload = function () {
          var s = Math.min(1, 1800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
          c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          var type = f.type === 'image/png' ? 'image/png' : 'image/jpeg'; res(pack(c.toDataURL(type, 0.9), type));
        }; im.src = url;
      }; rd.readAsDataURL(f);
    });
    function pack(dataUrl, type) { return { dataUrl: dataUrl, base64: dataUrl.split(',')[1], type: type }; }
  }

  function node(parent, key, label, top) {
    var v = parent[key];
    if (Array.isArray(v)) return arrayNode(v, label);
    if (v !== null && typeof v === 'object') {
      var fs = el('fieldset', {}, top ? [] : [el('legend', { text: pretty(label) })]);
      Object.keys(v).forEach(function (k) { fs.appendChild(node(v, k, k, false)); });
      if (top) { var wrap = el('div'); [].slice.call(fs.childNodes).forEach(function (c) { wrap.appendChild(c); }); return wrap; }
      return fs;
    }
    if (typeof v === 'boolean') {
      var cb = el('input', { type: 'checkbox' }); cb.checked = v;
      cb.addEventListener('change', function () { parent[key] = cb.checked; markDirty(); });
      var f0 = el('div', { class: 'field' }, [el('label', { class: 'bool' }, [cb, el('span', { text: pretty(key) })])]);
      if (HELP[key]) f0.appendChild(el('div', { class: 'help', text: HELP[key] })); return f0;
    }
    if (IMG_KEYS[key]) return field(pretty(key), imageControl(parent, key), key);
    var multi = TEXTAREA_KEYS[key] || String(v).length > 90;
    var inp = multi ? el('textarea') : el('input', { type: 'text' });
    inp.value = v == null ? '' : v;
    inp.addEventListener('input', function () { parent[key] = inp.value; markDirty(); });
    return field(pretty(key), inp, key);
  }

  function itemTitle(it, i) {
    if (typeof it === 'string') return it || ('Item ' + (i + 1));
    return it.name || it.title || it.label || it.number || it.eyebrow || ('Item ' + (i + 1));
  }
  function blank(o) {
    if (Array.isArray(o)) return [];
    if (o && typeof o === 'object') { var r = {}; Object.keys(o).forEach(function (k) { r[k] = blank(o[k]); }); return r; }
    return typeof o === 'boolean' ? false : '';
  }
  function arrayNode(arr, label) {
    var box = el('div');
    function rebuild() {
      box.innerHTML = '';
      arr.forEach(function (it, i) {
        var det = el('details', { class: 'item' });
        var sum = el('summary', {}, [el('span', { class: 't', text: itemTitle(it, i) }), el('span', { class: 'n', text: '#' + (i + 1) })]);
        var up = el('button', { class: 'btn btn-sm', type: 'button', text: '↑' }), dn = el('button', { class: 'btn btn-sm', type: 'button', text: '↓' }), rm = el('button', { class: 'btn btn-sm btn-danger', type: 'button', text: 'Remove' });
        [up, dn, rm].forEach(function (b) { b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); }); });
        up.addEventListener('click', function () { if (i > 0) { arr.splice(i - 1, 0, arr.splice(i, 1)[0]); markDirty(); rebuild(); } });
        dn.addEventListener('click', function () { if (i < arr.length - 1) { arr.splice(i + 1, 0, arr.splice(i, 1)[0]); markDirty(); rebuild(); } });
        rm.addEventListener('click', function () { if (confirm('Remove "' + itemTitle(it, i) + '"?')) { arr.splice(i, 1); markDirty(); rebuild(); } });
        [up, dn, rm].forEach(function (b) { sum.appendChild(b); });
        det.appendChild(sum);
        var body = el('div', { class: 'body' });
        if (typeof it === 'object') {
          Object.keys(it).forEach(function (k) { body.appendChild(node(it, k, k, false)); });
          // keep the summary title in sync while typing
          body.addEventListener('input', function () { sum.querySelector('.t').textContent = itemTitle(it, i); });
        } else {
          var inp = el('input', { type: 'text', value: it }); inp.addEventListener('input', function () { arr[i] = inp.value; sum.querySelector('.t').textContent = itemTitle(arr[i], i); markDirty(); }); body.appendChild(inp);
        }
        det.appendChild(body); box.appendChild(det);
      });
      var add = el('button', { class: 'btn', type: 'button', text: '+ Add new' });
      add.addEventListener('click', function () { arr.push(arr.length ? blank(arr[arr.length - 1]) : ''); markDirty(); rebuild(); var d = box.querySelectorAll('details'); if (d.length) d[d.length - 1].open = true; });
      box.appendChild(add);
    }
    rebuild();
    var wrap = el('div', { class: 'field' }, [el('label', { text: pretty(label) + ' (' + arr.length + ')' }), box]);
    return wrap;
  }

  // ---------- publish ----------
  function replaceValue(o, from, to) {
    if (Array.isArray(o)) { o.forEach(function (v, i) { if (v === from) o[i] = to; else replaceValue(v, from, to); }); }
    else if (o && typeof o === 'object') { Object.keys(o).forEach(function (k) { if (o[k] === from) o[k] = to; else replaceValue(o[k], from, to); }); }
  }
  $('publish').addEventListener('click', function () {
    var btn = $('publish'); btn.disabled = true; btn.textContent = 'Publishing...';
    var chain = Promise.resolve();
    Object.keys(pending).forEach(function (name) {
      chain = chain.then(function () {
        var p = pending[name];
        return api('upload', { json: { name: name.split('/').pop(), type: p.type, data: p.base64 } }).then(function (r) { replaceValue(data, name, r.url); delete pending[name]; });
      });
    });
    chain.then(function () { return api('content', { method: 'PUT', json: data }); })
      .then(function () { original = JSON.stringify(data); pending = {}; setDirty(false); show(current); toast('Published. The live site updates within a minute.'); })
      .catch(function (e) {
        if (e.status === 401) { toast('Your session expired. Please sign in again.', true); dirty = false; setTimeout(function () { location.reload(); }, 1500); return; }
        toast('Could not publish: ' + e.message, true); markDirty();
      })
      .then(function () { btn.textContent = 'Publish changes'; btn.disabled = !dirty; });
  });
  $('discard').addEventListener('click', function () {
    if (!dirty) return; if (!confirm('Throw away all unpublished changes?')) return;
    data = JSON.parse(original); pending = {}; setDirty(false); show(current);
  });
  $('backup').addEventListener('click', function () {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); a.download = 'site-content-backup.json'; a.click();
  });
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
